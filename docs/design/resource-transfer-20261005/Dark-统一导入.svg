acity="1"><rect x="988.0" y="425.2500000000001" width="112" height="38" rx="8" fill="#222225" stroke="#3A3A3F"/><text x="1044.0" y="449.2500000000001" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F7">生成安装预览</text></g><g opacity="1"><rect x="988.0" y="475.2500000000001" width="98" height="38" rx="8" fill="#F5F5F7" stroke="#3A3A3F"/><text x="1037.0" y="499.2500000000001" text-anchor="middle" font-size="14" font-weight="600" fill="#161618">确认并安装</text></g></g></svg>