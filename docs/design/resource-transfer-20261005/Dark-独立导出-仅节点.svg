" y="491.8" width="126" height="38" rx="8" fill="#222225" stroke="#3A3A3F"/><text x="115.0" y="515.8" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F7">分析并勾选依赖</text></g><text x="332.00" y="269.30" font-size="17" font-weight="600" fill="#F5F5F7">2 个参考工作流的依赖</text><text x="332.00" y="299.95" font-size="13" font-weight="400" fill="#B1B1B8">已勾选可唯一确认的依赖，可取消不需要的项目。</text><text x="332.00" y="332.80" font-size="17" font-weight="600" fill="#F5F5F7">关联模型</text><rect x="332" y="351.45" width="18" height="18" rx="4" fill="#222225" stroke="#B1B1B8"/><text x="358.00" y="364.45" font-size="14" font-weight="400" fill="#F5F5F7">修复模型.safetensors</text><text x="332.00" y="393.75" font-size="13" font-weight="400" fill="#B1B1B8">缺失 · 未选择，不阻止节点包导出</text><text x="332.00" y="426.60" font-size="17" font-weight="600" fill="#F5F5F7">关联节点包</text><rect x="332" y="445.25" width="18" height="18" rx="4" fill="#F5F5F7" stroke="#B1B1B8"/><path d="M 335,454.25 L 339,458.25 L 347,449.25" fill="none" stroke="#161618" stroke-width="2"/><text x="358.00" y="458.25" font-size="14" font-weight="600" fill="#F5F5F7">示例节点包 · RestoreImage、LoadImage</text><text x="332.00" y="487.55" font-size="13" font-weight="400" fill="#B1B1B8">用于：人像修复、放大图片</text><text x="332.00" y="516.40" font-size="13" font-weight="400" fill="#B1B1B8">完整节点包 · 共享依赖只写入一次</text><rect x="52.00" y="541.80" width="1176.00" height="120.55" rx="12" fill="#222225" stroke="#3A3A3F"/><text x="72.00" y="574.80" font-size="13" font-weight="400" fill="#B1B1B8">ZIP 内路径                                        大小（字节）</text><text x="72.00" y="605.65" font-size="13" font-weight="400" fill="#F5F5F7">custom_nodes/示例节点包/__init__.py</text><text x="72.00" y="636.50" font-size="13" font-weight="400" fill="#F5F5F7">custom_nodes/示例节点包/requirements.txt</text><text x="52.00" y="687.35" font-size="13" font-weight="400" fill="#F5F5F7">仅导出已勾选的节点包。</text><text x="52.00" y="712.20" font-size="13" font-weight="400" fill="#F5F5F7">›  高级选项</text><g opacity="