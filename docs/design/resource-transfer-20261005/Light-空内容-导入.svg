<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>FlowPack 可编辑设计源：空内容-导入 · Light</title><g font-family="Segoe UI,Microsoft YaHei UI,Microsoft YaHei,sans-serif"><rect x="0.00" y="0.00" width="1280.00" height="800.00" rx="0" fill="#F5F5F7" stroke="none"/><rect x="0.00" y="0.00" width="1280.00" height="64.00" rx="0" fill="#F5F5F7" stroke="none"/><text x="24.00" y="32.00" font-size="20" font-weight="600" fill="#1D1D1F">FlowPack</text><text x="24.00" y="51.00" font-size="10" font-weight="400" fill="#646469">COMFYUI RESOURCE TOOL</text><text x="543.00" y="26.00" font-size="14" font-weight="400" fill="#1D1D1F">首页</text><text x="603.00" y="26.00" font-size="14" font-weight="400" fill="#1D1D1F">资源库</text><text x="677.00" y="26.00" font-size="14" font-weight="600" fill="#1D1D1F">导入安装</text><g opacity="1"><rect x="1086" y="12" width="86" height="38" rx="8" fill="#FFFFFF" stroke="#DFDFE3"/><text x="1129.0" y="36" text-anchor="middle" font-size="14" font-weight="600" fill="#1D1D1F">选择实例</text></g><text x="1188.00" y="26.00" font-size="14" font-weight="400" fill="#1D1D1F">设置</text><text x="32.00" y="126.00" font-size="30" font-weight="600" fill="#1D1D1F">导入安装</text><text x="32.00" y="160.50" font-size="13" font-weight="400" fill="#646469">先检查资源内容与依赖，再选择安装到当前实例。</text><rect x="32.00" y="190.35" width="912.00" height="207.20" rx="12" fill="#FFFFFF" stroke="#DFDFE3"/><text x="52.00" y="227.35" font-size="17" font-weight="600" fill="#1D1D1F">导入资源</text><text x="52.00" y="260.00" font-size="13" font-weight="400" fill="#646469">选择 ZIP、工作流、资源目录或旧格式资源包。</text><g opacity="1"><rect x="52" y="277.85" width="86" height="38" rx="8" fill="#FFFFFF" stroke="#DFDFE3"/><text x="95.0" y="301.85" text-anchor="middle" font-size="14" font-weight="600" fill="#1D1D1F">选择文件</text></g><g opacity="1"><rect x="150" y="277.85" width="86" height="38" rx="8" fill="#FFFFFF" stroke="#DFDFE3"/><text x="193.0" y="301.85" text-anchor="middle" font-size="14" font-weight="600" fill="#1D1D1F">选择目录</text></g><text x="52.00" y="340.85" font-size="13" font-weight="400" fill="#646469">也可以将文件或目录拖到窗口中。</text><text x="52.00" y="371.70" font-size="13" font-weight="400" fill="#646469">来源：尚未选择来源</text><rect x="32.00" y="413.55" width="912.00" height="220.00" rx="12" fill="#FFFFFF" stroke="#DFDFE3"/><text x="52.00" y="446.55" font-size="13" font-weight="400" fill="#646469">选择来源后显示分组内容与依赖检查。</text><text x="32.00" y="662.55" font-size="13" font-weight="400" fill="#1D1D1F">›  导入历史 · 重新核对使用相同流程</text><rect x="968.00" y="190.35" width="280.00" height="400.00" rx="12" fill="#FFFFFF" stroke="#DFDFE3"/><text x="988.00" y="227.35" font-size="17" font-weight="600" fill="#1D1D1F">安装摘要</text><text x="988.00" y="260.00" font-size="13" font-weight="400" fill="#1D1D1F">目标：示例实例</text><text x="988.00" y="290.85" font-size="13" font-weight="400" fill="#646469">工作流：不安装</text><text x="988.00" y="321.70" font-size="13" font-weight="400" fill="#646469">模型：不安装</text><text x="988.00" y="352.55" font-size="13" font-weight="400" fill="#1D1D1F">节点包：示例节点包</text><text x="988.00" y="407.40" font-size="13" font-weight="400" fill="#646469">先检查计划，再安装。</text><g opacity="1"><rect x="988.0" y="425.2500000000001" width="112" height="38" rx="8" fill="#FFFFFF" stroke="#DFDFE3"/><text x="1044.0" y="449.2500000000001" text-anchor="middle" font-size="14" font-weight="600" fill="#1D1D1F">生成安装预览</text></g><g opacity=".45"><rect x="988.0" y="475.2500000000001" width="98" height="38" rx="8" fill="#FFFFFF" stroke="#DFDFE3"/><text x="1037.0" y="499.2500000000001" text-anchor="middle" font-size="14" font-weight="600" fill="#1D1D1F">确认并安装</text></g></g></svg>