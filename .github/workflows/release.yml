name: Build and release Windows installer

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read release mode
        id: release-mode
        shell: powershell
        run: |
          $manifestPath = "release-notes\$($env:GITHUB_REF_NAME).archive.json"
          $isArchive = Test-Path -LiteralPath $manifestPath
          if ($isArchive) {
            $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
            if ($manifest.kind -ne 'binary-archive' -or $manifest.version -ne $env:GITHUB_REF_NAME.TrimStart('v') -or
                $manifest.installerSha256 -notmatch '^[A-Fa-f0-9]{64}$' -or $manifest.installerBytes -le 0) {
              throw 'Invalid original-binary archive manifest.'
            }
            Write-Output 'Original local binary archive: do not rebuild or replace the preserved installer. Full original build source is unavailable; see release notes.'
          }
          "archive=$($isArchive.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install .NET SDK
        if: steps.release-mode.outputs.archive != 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        if: steps.release-mode.outputs.archive != 'true'
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build, test, and package
        if: steps.release-mode.outputs.archive != 'true'
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\build\Build-Release.ps1 -Version $version

      - name: Upload workflow artifact
        if: steps.release-mode.outputs.archive != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ComfyUI-FlowPack-${{ github.ref_name }}-Windows
          path: |
            artifacts/installer/*.exe
            artifacts/installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.release-mode.outputs.archive != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "release-notes\$tag.md"
          $assets = @((Get-ChildItem artifacts\installer\*.exe).FullName)
          $assets += (Resolve-Path artifacts\installer\SHA256SUMS.txt).Path
          if (Test-Path $notes) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --title "ComfyUI FlowPack $($tag.TrimStart('v'))" --notes-file $notes @assets
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --title "ComfyUI FlowPack $($tag.TrimStart('v'))" --generate-notes @assets
          }
